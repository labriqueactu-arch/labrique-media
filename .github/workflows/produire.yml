name: Production

# Une commande poussée dans a_produire/ devient un post image et un Reel prêts, puis la publication
# est lancée (elle attend l'heure prévue). Le rapport est dans produit/<id>.json.
on:
  push:
    branches: [main]
    paths: ["a_produire/**"]
  workflow_dispatch:
    inputs:
      commandes:
        description: "chemins des commandes à produire (séparés par des espaces)"
        required: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache des outils
        uses: actions/cache@v4
        with:
          path: |
            /tmp/lb-tools
            ~/.cache/ms-playwright
            ~/.cache/labrique-voix
          key: lb-outils-v1
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright pillow "opencv-python-headless<5" numpy
          python -m playwright install --with-deps chromium >/dev/null
          mkdir -p /tmp/lb-tools && cd /tmp/lb-tools
          [ -f package.json ] || echo '{"name":"lb-tools","private":true,"overrides":{"sharp":"0.33.5"}}' > package.json
          [ -d node_modules/@imgly/background-removal-node ] || npm install @imgly/background-removal-node@1.4.5 --no-audit --no-fund --silent
      - name: Commandes à produire
        id: liste
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "commandes=${{ inputs.commandes }}" >> "$GITHUB_OUTPUT"
          else
            echo "commandes=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- a_produire/ | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Production
        id: prod
        continue-on-error: true
        timeout-minutes: 20
        run: python3 tools/produire.py ${{ steps.liste.outputs.commandes }}
      - name: Enregistrement
        run: |
          git config user.name "La Brique (production)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in posts a_publier produit banque; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet || git commit -q -m "Production : ${{ steps.liste.outputs.commandes }}"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Lancement de la publication
        if: steps.prod.outcome == 'success'
        run: |
          fiches=""
          for c in ${{ steps.liste.outputs.commandes }}; do
            id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$c")
            [ -f "a_publier/$id-1-post.json" ] && fiches="$fiches a_publier/$id-1-post.json a_publier/$id-2-reel.json"
          done
          [ -n "$fiches" ] && gh workflow run publier.yml -f action="publier$fiches" || echo "rien à publier (essai)"
      - name: Échec
        if: steps.prod.outcome != 'success'
        run: |
          echo "Production refusée : lire produit/<id>.json, corriger la commande, repousser."
          exit 1
